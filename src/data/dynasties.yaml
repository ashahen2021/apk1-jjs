# The 30 dynasties of Manetho. Dates follow the conventional chronology
# (Shaw, ed., The Oxford History of Ancient Egypt, 2000) and are approximate.
# Several dynasties overlap because rival houses ruled parts of Egypt at once.
- id: "1"
  number: 1
  name: First Dynasty
  period: early-dynastic
  start: -3000
  end: -2890
  capital: Memphis (royal burials at Abydos)
  rulers: [Narmer, Aha, Djer, Djet, Den, Merneith (regent), Anedjib, Semerkhet, Qaa]
  summary: The first kings of a unified Egypt found Memphis, record events with early hieroglyphs and are buried in great tombs at Abydos.
  history:
    - heading: "The first kings of a united Egypt"
      text: |
        The First Dynasty began with the unification of Upper and Lower Egypt under a king remembered as Menes, usually identified with Narmer. Much of what we know comes from objects carrying royal names, above all the Narmer Palette and the Narmer Macehead, whose scenes of victory over enemies have long been read as a record of the conquest of the Delta.

        Power was centred on Thinis in Upper Egypt. The kings that followed included Hor-Aha, Djer, Djet and Den. Merneith, the mother of Den, received a tomb on the same scale as the kings' tombs close to those of Djet and Den, and may have ruled as regent, possibly as the first woman to govern Egypt.
    - heading: "Tombs at Abydos and Saqqara"
      text: |
        The kings were buried in large tombs at Umm el-Qa'ab near Abydos, while great mudbrick tombs at Saqqara and Helwan, near Memphis, belonged to the elite of the new state. These early tombs were built mostly of wood and mud brick, with stone used only for some floors and walls.

        A grim feature of the period was the burial of servants and animals around the royal tombs to serve the king in the afterlife: hundreds of subsidiary burials surround the tomb of Djer. The practice ended with the dynasty; the tomb of Qa'a, the last king, is the last with subsidiary burials.
    - heading: "Early writing"
      text: |
        Hieroglyphic writing was still young and was used mainly for names, labels and short notes on objects such as year labels. Detailed records of the first two dynasties do not survive; the main later source is the terse annals of the Palermo Stone.

        Modern radiocarbon studies place the reigns of Hor-Aha and Den around 3100–2900 BCE, consistent with the conventional dates used on this site.
  sources:
    - label: "Wikipedia, \"First Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/First_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "2"
  number: 2
  name: Second Dynasty
  period: early-dynastic
  start: -2890
  end: -2686
  capital: Memphis
  rulers: [Hetepsekhemwy, Raneb, Nynetjer, Peribsen, Khasekhemwy]
  summary: A turbulent dynasty in which Horus and Seth kingships appear to compete, ending with Khasekhemwy's consolidation of the state.
  history:
    - heading: "An obscure century"
      text: |
        The Second Dynasty is one of the least known periods of Egyptian history. Archaeological evidence is scarce, but comparing the First and Third Dynasties shows that this was a time of important institutional and economic development, laying the foundations of the centralised state of the Old Kingdom.

        The early kings, Hotepsekhemwy, Raneb (Nebra) and Nynetjer, were probably buried in large underground gallery tombs at Saqqara, near the new administrative centre at Memphis.
    - heading: "Horus and Seth"
      text: |
        After Nynetjer the picture becomes confused. Some scholars think the country was divided and ruled by two lines of kings for a time. The king Peribsen broke with tradition by writing his name under the god Seth rather than Horus, the falcon god normally linked to the king, and he chose to be buried at Abydos, in Tomb P at Umm el-Qa'ab.
    - heading: "Khasekhemwy reunites the land"
      text: |
        The last king, Khasekhemwy, wrote his name under both Horus and Seth, a sign that the two traditions had been reconciled. A statue base from Hierakonpolis shows slain enemies, recording a campaign against northern rebels.

        Khasekhemwy was buried in Tomb V at Umm el-Qa'ab, and at Abydos he built a colossal mudbrick funerary enclosure, the Shunet ez-Zebib, which still stands. His successors of the Third Dynasty would translate such enclosures into stone.
  sources:
    - label: "Wikipedia, \"Second Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Second_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "3"
  number: 3
  name: Third Dynasty
  period: old-kingdom
  start: -2686
  end: -2613
  capital: Memphis
  rulers: [Djoser, Sekhemkhet, Khaba, Huni]
  summary: Djoser and his architect Imhotep build the Step Pyramid at Saqqara, the first monumental stone building in the world.
  history:
    - heading: "Building for eternity in stone"
      text: |
        The Third Dynasty opened the Old Kingdom, with its capital at Memphis. Its most famous king, Djoser, known in his own time by his Horus name Netjerikhet, made a revolutionary choice: to build his tomb not in mud brick but in stone.

        At Saqqara his architect Imhotep stacked six mastaba-like stages into the Step Pyramid, about 62 m high, inside a vast walled complex whose stone buildings imitate structures of wood, reed and brick. Later generations honoured Imhotep as a sage, and by the Late Period he was worshipped as a god of healing.
    - heading: "Djoser's successors"
      text: |
        Djoser's successor Sekhemkhet began a step pyramid of his own at Saqqara that was never finished. The so-called Layer Pyramid at Zawyet el-Aryan is usually attributed to Khaba. The last king of the dynasty was Huni.

        These unfinished monuments show that the Step Pyramid was not a one-off: the kings of the Third Dynasty were developing the techniques of large-scale stone building that their successors of the Fourth Dynasty would take to the true pyramid.
  sources:
    - label: "Wikipedia, \"Third Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Third_Dynasty_of_Egypt
    - label: "NeoKemetAI pages on Djoser and the Step Pyramid of Djoser"
      url: https://neokemetai.online/monuments/step-pyramid-of-djoser/
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "4"
  number: 4
  media:
    hero:
      src: ../assets/media/monuments/great-pyramid/giza-today.jpg
      alt: The pyramids of Giza, built by the kings of the Fourth Dynasty, at golden hour.
      kind: reconstruction
      credit: NeoKemetAI 3D reconstruction
  name: Fourth Dynasty
  period: old-kingdom
  start: -2613
  end: -2494
  capital: Memphis
  rulers: [Sneferu, Khufu, Djedefra, Khafra, Menkaura, Shepseskaf]
  summary: The pyramid builders. Sneferu perfects the true pyramid at Dahshur and his successors raise the pyramids and Great Sphinx of Giza.
  history:
    - heading: "The age of the great pyramids"
      text: |
        The Fourth Dynasty is often called the golden age of the Old Kingdom. In a little over a century, its kings turned the stepped tombs of their predecessors into the smooth-sided true pyramid and built the largest stone monuments Egypt would ever raise. It was also a period of relative peace in which trade and expeditions abroad are recorded officially.

        The founder, Sneferu, was the most prolific builder of all. Three pyramids are credited to him: the pyramid at Meidum and, at Dahshur, the Bent Pyramid, whose angle changes halfway up, and the Red Pyramid, the first successful true pyramid. Each one shows the builders learning how to make a stable smooth slope.
    - heading: "Giza"
      text: |
        Sneferu's son Khufu moved the royal cemetery to the Giza plateau and built the Great Pyramid, the largest of them all. His son Djedefre built a pyramid further north at Abu Rawash. Khafre returned to Giza for the second pyramid, and the Great Sphinx is usually attributed to his reign; he also left more statues than any other king of the dynasty. Menkaure built the third and smallest of the main Giza pyramids.

        The last secure king, Shepseskaf, broke the chain of pyramid building and was buried in a large mastaba tomb at South Saqqara, known today as Mastabat al-Fir'aun.
    - heading: "Running the state"
      text: |
        The king governed through viziers and through nomarchs in the provinces, and many of the highest offices were held by royal princes. Royal women were prominent too: Khentkaus I carried titles and regalia normally reserved for kings, which has led some scholars to suggest that she may have ruled.

        Expeditions went to Sinai, Nubia and Libya for copper, stone and labour, and the Red Sea harbour at Wadi al-Jarf linked Egypt with Sinai. Its art ranges from royal statues and reliefs to limestone busts and sphinxes, such as those of Khafre and Hetepheres II. The dynasty ended around 2494 BCE and was followed by the Fifth Dynasty.
  sources:
    - label: "Wikipedia, \"Fourth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Fourth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "5"
  number: 5
  name: Fifth Dynasty
  period: old-kingdom
  start: -2494
  end: -2345
  capital: Memphis
  rulers: [Userkaf, Sahura, Neferirkara, Nyuserra, Djedkara Isesi, Unas]
  summary: Kings build sun temples to Ra at Abusir. Unas inscribes the Pyramid Texts, the oldest religious texts in Egypt, inside his pyramid.
  history:
    - heading: "Kings and the sun god"
      text: |
        The kings of the Fifth Dynasty placed the sun god Ra at the heart of kingship. Beside their pyramids at Abusir, south of Giza, several of them built sun temples dedicated to Ra, beginning with the dynasty's founder, Userkaf.

        Their pyramids were smaller than those of the Fourth Dynasty, but their temples were richly decorated with reliefs. Papyri found at Abusir, from the temple of Neferirkare, are among the oldest administrative archives to survive from Egypt and show in detail how a royal cult was run day to day.
    - heading: "Expeditions and officials"
      text: |
        Under Sahure, Egypt sent ships to the distant land of Punt for incense and other exotic goods, an expedition recorded in later annals. The administration grew, and officials outside the royal family took on more of the work of government; their large decorated tombs at Saqqara and Giza show scenes of daily life, farming and crafts in rich detail.
    - heading: "Unas and the Pyramid Texts"
      text: |
        The last king, Unas, built a small pyramid at Saqqara whose burial chamber walls were, for the first time, covered with religious spells: the Pyramid Texts, the oldest body of religious writing from Egypt. They describe the king's journey to join the gods in the sky and were copied in the pyramids of later kings and queens.

        After Unas the throne passed to Teti, the first king of the Sixth Dynasty.
  sources:
    - label: "Wikipedia, \"Fifth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Fifth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "6"
  number: 6
  name: Sixth Dynasty
  period: old-kingdom
  start: -2345
  end: -2181
  capital: Memphis
  rulers: [Teti, Userkara, Pepi I, Merenra, Pepi II]
  summary: Provincial governors grow powerful. Pepi II's reign, among the longest in history, ends in a weakened state.
  history:
    - heading: "A new royal house"
      text: |
        Teti, the first king of the Sixth Dynasty, followed Unas on the throne. The later historian Manetho claims that Teti was murdered by his bodyguard; contemporary sources do not confirm it, but the story may explain the short reign of an ephemeral king, Userkare, attested between Teti and Pepi I.

        Pepi I survived a conspiracy hatched in the royal harem, known from later records. His reign saw expeditions to Sinai, the alabaster quarries of Hatnub, the Wadi Hammamat, Punt and the cities of Byblos and Ebla in the Levant. He was followed by Merenre.
    - heading: "Pepi II and Harkhuf"
      text: |
        Pepi II became king as a boy and ruled for more than six decades; Manetho credits him with 94 years, one of the longest reigns in history. One of the most human documents of the Old Kingdom comes from his childhood: a letter he wrote to the expedition leader Harkhuf, copied on the wall of Harkhuf's tomb at Aswan, telling him to take great care of a dancing pygmy he was bringing back from the land of Yam.
    - heading: "The end of the Old Kingdom"
      text: |
        Throughout the dynasty, the inscriptions in officials' tombs show the growing power of the nobility and of provincial governors, the nomarchs, who passed their offices on within their families. Royal authority weakened as theirs grew.

        After the death of Pepi II, his many short-lived successors could not hold the provinces together. Manetho places a ruler named Nitocris at the end of the dynasty, a name now thought to come from a misreading of a king's name. Decentralisation led into the First Intermediate Period.
  sources:
    - label: "Wikipedia, \"Sixth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Sixth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "7"
  number: 7
  name: Seventh Dynasty
  period: old-kingdom
  start: -2181
  end: -2170
  capital: Memphis
  rulers: [Ephemeral kings, poorly attested]
  summary: Manetho's "seventy kings in seventy days" — probably a literary way of describing a collapse of central rule after Pepi II.
- id: "8"
  number: 8
  name: Eighth Dynasty
  period: old-kingdom
  start: -2170
  end: -2160
  capital: Memphis
  rulers: [Qakara Ibi, Neferkaura, Neferirkara II]
  summary: Short-lived Memphite kings who claimed Old Kingdom legitimacy while real power passed to the provinces.
- id: "9"
  number: 9
  name: Ninth Dynasty
  period: first-intermediate
  start: -2160
  end: -2130
  capital: Herakleopolis
  rulers: [Meryibra Khety, Neferkara]
  summary: A new royal house at Herakleopolis, near the Faiyum, controls northern and middle Egypt.
- id: "10"
  number: 10
  name: Tenth Dynasty
  period: first-intermediate
  start: -2130
  end: -2040
  capital: Herakleopolis
  rulers: [Wahkara Khety, Merikara]
  summary: The Herakleopolitan kings fight the Theban Intefs. The Teaching for Merikara, a classic of wisdom literature, is set in this era.
- id: "11"
  number: 11
  name: Eleventh Dynasty
  period: middle-kingdom
  start: -2125
  end: -1985
  capital: Thebes
  rulers: [Intef I, Intef II, Intef III, Mentuhotep II, Mentuhotep III, Mentuhotep IV]
  summary: Theban rulers expand north. Mentuhotep II reunifies Egypt around 2055 BCE and begins the Middle Kingdom.
  history:
    - heading: "Governors of Thebes become kings"
      text: |
        The Eleventh Dynasty began as a family of provincial governors at Thebes in Upper Egypt, at a time when the country was divided. Its ancestor, Intef the Great, son of Iku, was a nomarch, a provincial governor, and never ruled as king; the first to be counted as a king is usually Mentuhotep I.

        An inscription from the reign of Intef II shows that he was the first of the family to claim the rule of all Egypt. That claim brought the Thebans into conflict with the rival kings of the Tenth Dynasty at Herakleopolis in the north. Intef II campaigned northwards and took the important province of Abydos.
    - heading: "Reunification under Mentuhotep II"
      text: |
        Warfare between Thebes and Herakleopolis continued on and off for decades, until the Herakleopolitans were defeated under Mentuhotep II, before the 39th year of his long reign. Egypt was united again, and his reign is taken as the beginning of the Middle Kingdom.

        The Theban kings reasserted Egyptian influence abroad. Mentuhotep II sent expeditions to Phoenicia for cedar, and his successor Mentuhotep III sent an expedition from Coptos to the land of Punt.
    - heading: "A mysterious ending"
      text: |
        Later records speak of "seven empty years" after the death of Mentuhotep III, which correspond to the reign of Mentuhotep IV, a king who was often left off later king lists. Almost the only thing known about his reign is that his vizier, Amenemhat, recorded two remarkable omens while leading an expedition to the quarries of the Wadi Hammamat.

        Many scholars identify this vizier with Amenemhat I, the founder of the Twelfth Dynasty. How he came to the throne is not known; one theory is that he seized power in a palace coup.
  sources:
    - label: "Wikipedia, \"Eleventh Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Eleventh_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "12"
  number: 12
  name: Twelfth Dynasty
  period: middle-kingdom
  start: -1985
  end: -1773
  capital: Itjtawy (near el-Lisht)
  rulers: [Amenemhat I, Senusret I, Amenemhat II, Senusret II, Senusret III, Amenemhat III, Amenemhat IV, Sobekneferu]
  summary: A classical age of art and literature. Senusret III fortifies Nubia and Sobekneferu becomes one of Egypt's first confirmed female kings.
  history:
    - heading: "A new beginning at Itjtawy"
      text: |
        The Twelfth Dynasty is often seen as the high point of the Middle Kingdom: a period of stability, expansion and unusually well-recorded history. Its founder, Amenemhat I, moved the capital from Thebes to a new city near el-Lisht called Itjtawy, a name meaning "Amenemhat is the one who seizes the Two Lands". He campaigned south as far as the Second Cataract, began a chain of forts in Nubia and renewed diplomatic contact with Byblos.

        His son Senusret I probably ruled alongside him for about ten years, a co-regency that helped secure the succession. Senusret I pushed Egyptian control in Nubia towards the Third Cataract, built his pyramid at el-Lisht and worked on temples across Egypt, including Karnak.
    - heading: "Peace, farming and fortresses"
      text: |
        Amenemhat II reigned in peace while trade with Asia, the Mediterranean and Africa flourished; he built his pyramid at Dahshur. Senusret II was the first king to develop the Faiyum basin for farming, with canals and drainage works that turned it into one of the richest regions of Egypt.

        Senusret III changed the shape of the state. He sent punitive campaigns into Nubia, built and enlarged massive border fortresses, and reorganised government by replacing the old system of provinces with three large administrative districts, reducing the power of local governors.
    - heading: "Classical literature and the end of the dynasty"
      text: |
        Amenemhat III is remembered for his pyramid at Hawara and its vast mortuary temple, later known as the Labyrinth. The period produced many of the works later Egyptians treated as classics, including the Story of Sinuhe, the Eloquent Peasant, the Prophecy of Neferti and the Instructions of Amenemhat.

        Amenemhat IV appears to have died without an heir. He was followed by Sobekneferu, the first woman confirmed to have taken the full titles of king, who reigned for about four years. After her the throne passed to the kings of the Thirteenth Dynasty.
  sources:
    - label: "Wikipedia, \"Twelfth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Twelfth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "13"
  number: 13
  name: Thirteenth Dynasty
  period: middle-kingdom
  start: -1773
  end: -1650
  capital: Itjtawy, later Thebes
  rulers: [Sobekhotep I, Neferhotep I, Sobekhotep IV, Ay]
  summary: Dozens of short reigns keep the Middle Kingdom administration running while the Delta slips from royal control.
  history:
    - heading: "Many kings, one administration"
      text: |
        The Thirteenth Dynasty followed the Twelfth without an obvious break in government. Its kings at first continued to rule from Itjtawy, the Middle Kingdom capital near el-Lisht, and the administration built up by their predecessors kept working.

        What makes the dynasty unusual is the number of its kings. Dozens of rulers are known, many of whom reigned for only a few years or even months, and the order of several of them is still uncertain. Much of the day-to-day continuity seems to have rested with the high officials, above all the viziers, rather than with the kings themselves.
    - heading: "The best-known reigns"
      text: |
        A few kings reigned long enough to leave more substantial monuments. Neferhotep I and Sobekhotep IV, apparently brothers, are among the best attested, with inscriptions and statues from several sites in Egypt.

        During the dynasty, royal control of the eastern Delta weakened, where communities of people from the Levant had grown in number. Later in the period the kings' authority was concentrated in the south, and Thebes became increasingly important.
    - heading: "Into the Second Intermediate Period"
      text: |
        The end of the Thirteenth Dynasty is poorly understood. As its rulers lost hold of the north, other lines of kings arose in the Delta, among them the rulers known as the Hyksos, who would form the Fifteenth Dynasty. Egypt entered the Second Intermediate Period, a time when several dynasties ruled different parts of the country at once.

        Because the sources are fragmentary, dates and reign lengths for this period vary between reference works; the dates on this site follow the conventional chronology and are approximate.
  sources:
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): standard reference, chronology used on this site"
    - label: "Wikipedia, \"Thirteenth Dynasty of Egypt\" (for further reading)"
      url: https://en.wikipedia.org/wiki/Thirteenth_Dynasty_of_Egypt
- id: "14"
  number: 14
  name: Fourteenth Dynasty
  period: second-intermediate
  start: -1773
  end: -1650
  capital: Avaris (eastern Delta)
  rulers: [Nehesy, Yakbim, Sheshi]
  summary: A line of rulers, many with Canaanite names, governs the eastern Delta in parallel with the 13th Dynasty.
- id: "15"
  number: 15
  name: Fifteenth Dynasty (Hyksos)
  period: second-intermediate
  start: -1650
  end: -1550
  capital: Avaris
  rulers: [Salitis, Khyan, Apepi, Khamudi]
  summary: The Hyksos, "rulers of foreign lands", take Memphis and rule the north, introducing the horse and chariot on a wide scale.
- id: "16"
  number: 16
  name: Sixteenth Dynasty
  period: second-intermediate
  start: -1650
  end: -1580
  capital: Thebes
  rulers: [Djehuti, Sobekhotep VIII, Neferhotep III]
  summary: Minor Theban kings hold Upper Egypt under pressure from the Hyksos in the north and Kush in the south.
- id: "17"
  number: 17
  name: Seventeenth Dynasty
  period: second-intermediate
  start: -1580
  end: -1550
  capital: Thebes
  rulers: [Intef V, Seqenenra Taa, Kamose]
  summary: Theban kings launch the war of liberation. Seqenenra Taa dies in battle and Kamose pushes the Hyksos back to Avaris.
  history:
    - heading: "Kings at Thebes"
      text: |
        The Seventeenth Dynasty ruled from Thebes in Upper Egypt during the last decades of the Second Intermediate Period, while the Hyksos kings of the Fifteenth Dynasty held the north from their capital at Avaris. Its chronology is very uncertain and the later king lists help little, but most scholars regard it as a native Egyptian dynasty, founded by a king named Rahotep.

        Under Hyksos supremacy the Theban kings revived the cult of Osiris, rebuilt temples and secured the religious centre of Abydos, the first steps towards reuniting the country.
    - heading: "The war of liberation"
      text: |
        Open war began under Seqenenre Tao, who was killed in the fighting; the wounds on his mummy are among the most vivid evidence of the conflict. His son Kamose secured the south and then carried the war north against the Hyksos, but he died suddenly after only about two years on the throne.

        Kamose left no sons. His younger brother Ahmose came to the throne as a boy of about ten.
    - heading: "From Thebes to a united Egypt"
      text: |
        When he was old enough to lead the army, Ahmose took Memphis, captured the Hyksos capital with the help of the fleet, and pursued the Hyksos into southern Canaan, besieging their stronghold at Sharuhen for three years.

        With that victory Ahmose reunited Upper and Lower Egypt. He is counted as the first king of the Eighteenth Dynasty, and his reign opens the New Kingdom.
  sources:
    - label: "Wikipedia, \"Seventeenth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Seventeenth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "18"
  number: 18
  name: Eighteenth Dynasty
  period: new-kingdom
  start: -1550
  end: -1295
  capital: Thebes, briefly Amarna
  rulers: [Ahmose I, Amenhotep I, Thutmose I, Thutmose II, Hatshepsut, Thutmose III, Amenhotep II, Thutmose IV, Amenhotep III, Akhenaten, Smenkhkara, Tutankhamun, Ay, Horemheb]
  summary: Egypt's most famous dynasty builds an empire, raises Karnak and Luxor, experiments with Akhenaten's sun-disc religion and produces Tutankhamun.
  history:
    - heading: "Liberation and empire"
      text: |
        The Eighteenth Dynasty opened the New Kingdom. Ahmose I completed the war against the Hyksos rulers of the north, reunited Egypt and ended the Second Intermediate Period. His successors turned victory into empire: under Thutmose I, Egyptian armies reached Carchemish on the Euphrates and Lower Nubia was conquered.

        After the short reign of Thutmose II, his widow Hatshepsut first acted as regent for her young stepson Thutmose III and then took the full titles of king, ruling for about two decades. Thutmose III went on to lead the campaigns that gave Egypt its greatest extent, from Kush in the south to the borders of the Hittite world in the north, beginning with his victory at Megiddo.
    - heading: "Splendour and revolution"
      text: |
        Amenhotep III presided over an era of prosperity, international prestige and lavish building; over 250 statues of him are known. His son Amenhotep IV changed his name to Akhenaten, made the sun disc Aten the centre of state religion and built a new capital at Amarna, called Akhetaten.

        The experiment did not outlast him. Tutankhaten, probably his son, became king as a child, restored the traditional cults and changed his name to Tutankhamun. He died young after about a decade on the throne.
    - heading: "The last kings"
      text: |
        Tutankhamun was followed by the official Ay, who married his widow Ankhesenamun, and then by the general Horemheb, who set about erasing the memory of the Amarna kings. Many kings of the dynasty were buried in rock-cut tombs in the Valley of the Kings at Thebes.

        Horemheb had no surviving children. He chose his vizier Paramessu as heir, who became king as Ramesses I and founded the Nineteenth Dynasty.
  sources:
    - label: "Wikipedia, \"Eighteenth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Eighteenth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "19"
  number: 19
  name: Nineteenth Dynasty
  period: new-kingdom
  start: -1295
  end: -1186
  capital: Pi-Ramesses (Delta) and Memphis
  rulers: [Ramesses I, Seti I, Ramesses II, Merenptah, Amenmesse, Seti II, Siptah, Twosret]
  summary: The Ramesside age. Ramesses II fights at Kadesh, signs the first known peace treaty and fills Egypt with colossal monuments.
  history:
    - heading: "A family of soldiers"
      text: |
        The Nineteenth Dynasty, the first half of the Ramesside period, was founded by Ramesses I, a former vizier whom Horemheb had chosen as his successor. His reign was short. His son Seti I campaigned against the Libyans and the Hittites and briefly took the Syrian city of Kadesh, before settling an informal peace with the Hittite king. The famous king list of Abydos was completed during his reign.
    - heading: "Ramesses the Great"
      text: |
        Ramesses II ruled for about 66 years. In his fifth year he marched on Kadesh, was caught in an ambush and fought his way out, a battle he later celebrated on temple walls across Egypt. Fighting with the Hittites continued for years until, in his 21st year, he concluded a treaty with the Hittite king Hattusili III, the earliest peace treaty whose text survives.

        Ramesses built a new capital in the eastern Delta, Pi-Ramesses, and filled Egypt and Nubia with monuments, among them the rock-cut temples of Abu Simbel and his mortuary temple at Thebes, the Ramesseum.
    - heading: "Rivalry and decline"
      text: |
        Ramesses II outlived many of his sons and was succeeded by Merenptah. After him, rivalry inside the royal family weakened the throne: Amenmesse seized power for a few years before Seti II regained it, and Seti II was followed by the young Siptah and then by Queen Twosret, who ruled as king.

        Twosret could not hold power amid court conspiracies. She was probably removed by Setnakhte, the founder of the Twentieth Dynasty.
  sources:
    - label: "Wikipedia, \"Nineteenth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Nineteenth_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "20"
  number: 20
  name: Twentieth Dynasty
  period: new-kingdom
  start: -1186
  end: -1069
  capital: Pi-Ramesses and Thebes
  rulers: [Sethnakht, Ramesses III, Ramesses IV, Ramesses VI, Ramesses IX, Ramesses XI]
  summary: Ramesses III repels the Sea Peoples, but strikes, tomb robberies and a harem conspiracy mark the decline of the New Kingdom.
  history:
    - heading: "Setnakhte and Ramesses III"
      text: |
        The Twentieth Dynasty was the last of the New Kingdom. It began after a period of civil war at the end of the Nineteenth Dynasty, recorded on a stela at Elephantine set up by Setnakhte, who restored order and founded the new line. He reigned only a few years and was succeeded by his son Ramesses III.

        Ramesses III faced the great crisis of the age. The movements of the Sea Peoples were part of the collapse of the Late Bronze Age world, in which the Hittite empire disappeared. Ramesses defeated Libyan invasions in his 5th and 11th years and, in his 8th year, a confederacy of Sea Peoples on land and at sea. His mortuary temple at Medinet Habu records these wars.
    - heading: "Strikes, conspiracy and robbery"
      text: |
        Strain soon showed. In Ramesses III's 29th year the royal tomb builders of Deir el-Medina stopped work when their rations failed to arrive, the first recorded strike in history. His reign ended with a harem conspiracy to put his son Pentawer on the throne; the plot killed the king, but his heir Ramesses IV succeeded and had the conspirators tried.

        Ramesses IV began ambitious building works and sent large expeditions to the Wadi Hammamat. Under his successors, the workmen were repeatedly kept from work by fear of Libyan raiders. In the 16th and 17th years of Ramesses IX, investigations into tomb robbery at Thebes found that many tombs had been broken into.
    - heading: "Priests and the end of the New Kingdom"
      text: |
        The tomb of Ramesses VI, cut into the Valley of the Kings, buried the entrance of Tutankhamun's tomb under its debris and so kept it safe until 1922. Meanwhile, documents such as the Wilbour Papyrus show how much land and wealth was controlled by the temple of Amun.

        Droughts, low Nile floods, famine, unrest and quarrels among the heirs of Ramesses III weakened the kings further. Under Ramesses XI, the High Priests of Amun were effectively rulers of the south, while Smendes controlled the north. After Ramesses XI's death, Smendes founded the Twenty-first Dynasty at Tanis.
  sources:
    - label: "Wikipedia, \"Twentieth Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Twentieth_Dynasty_of_Egypt
    - label: "NeoKemetAI pages on Ramesses III and KV62"
      url: https://neokemetai.online/pharaohs/ramesses-iii/
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): chronology used on this site"
- id: "21"
  number: 21
  name: Twenty-first Dynasty
  period: third-intermediate
  start: -1069
  end: -945
  capital: Tanis
  rulers: [Smendes, Amenemnisu, Psusennes I, Amenemope, Siamun, Psusennes II]
  summary: Kings rule from Tanis while the High Priests of Amun govern Thebes. Royal mummies are gathered into caches for safety.
  history:
    - heading: "Kings at Tanis, priests at Thebes"
      text: |
        The Twenty-first Dynasty opened the Third Intermediate Period. Its founder, Smendes, had already controlled Lower Egypt under the last Ramesside king. The new kings ruled from Tanis in the north-eastern Delta, which is why the dynasty is called Tanite, but their power was effective mainly in Lower Egypt.

        In Middle and Upper Egypt, the High Priests of Amun at Thebes governed in all but name, while still recognising the kings at Tanis.
    - heading: "Royal tombs at Tanis"
      text: |
        The kings of the dynasty were buried inside the temple enclosure at Tanis. The tombs found there in the 20th century, including that of Psusennes I with its precious burial equipment, are among the richest royal burials known from Egypt, although they are far less famous than Tutankhamun's.
    - heading: "Saving the New Kingdom kings"
      text: |
        In Thebes, the priests faced the consequences of the tomb robberies of the late New Kingdom. They gathered the mummies of many earlier kings from their plundered tombs in the Valley of the Kings, rewrapped them and reburied them together in hidden caches, such as the one at Deir el-Bahari found in 1881, which held the mummy of Seti I among others.

        Manetho gives the dynasty a length of 130 years. It was followed by the kings of Libyan descent of the Twenty-second Dynasty.
  sources:
    - label: "Wikipedia, \"Twenty-first Dynasty of Egypt\" (reference work consulted)"
      url: https://en.wikipedia.org/wiki/Twenty-first_Dynasty_of_Egypt
    - label: "I. Shaw (ed.), The Oxford History of Ancient Egypt (Oxford, 2000): standard reference, chronology used on this site"
