title: Plan of KV17, the tomb of Seti I
source: Every corridor, gate, chamber and side chamber down to the burial chamber is sized to the Theban Mapping Project survey of KV 17, using its letters (A–K). The survey gives measurements, not coordinates, so the lateral offsets (where the axis shifts left at the descent in F), the position of doorways along walls, the split between the two levels of the burial chamber and all floor depths are reconstructed. The tunnel K is shown only for its first metres.
note: The axis descends south-west into the hillside. It shifts left (south-east) at the descent cut into the pillared chamber F, and continues in a straight line to the burial chamber J and the tunnel K.
levels: No floor depths are published on the Theban Mapping Project page, so all levels are reconstructed. The only published slopes are for stairwell C (steps at a steep 30°) and the tunnel K (its ancient ramp slopes at about 34° to 36°). KV 17 is described by the survey as the longest and deepest tomb in the Valley of the Kings.
camera: { theta: 100, phi: 58 }
route: [kv17-a, kv17-gb, kv17-b, kv17-gc, kv17-c, kv17-gd, kv17-d, kv17-ge, kv17-e, kv17-gf, kv17-f, kv17-fd, kv17-gg, kv17-g, kv17-gh, kv17-h, kv17-gi, kv17-i, kv17-gj, kv17-j, kv17-j2]
sources:
  - id: tmp
    label: Theban Mapping Project, "KV 17 (Sety I)", American Research Center in Egypt
    url: https://thebanmappingproject.com/tombs/kv-17-sety-i
    used: Chamber sequence (seven corridors, ten chambers, side chambers Fa and Ja–Je, passage K); length, width, height, area and orientation of every space and gate; pillar counts and widths; the 30° stairwell; positions of side chambers by wall; decoration by wall; the sarcophagus find-spot.
  - id: hamed
    label: "A. Hamed, \"Re-excavation of Seti First Tomb, KV17, Luxor, Egypt\", International Journal of Conservation Science (2013; accepted September 2013)"
    url: https://ijcs.ro/public/IJCS-13-41-Hamed.pdf
    used: "Tunnel K: re-excavated 2007–2010 over a length of 174 m; roughly 2 × 2 m cross-section; ancient ramp sloping 34° to 36° (after K. R. Weeks)."
  - id: belzoni
    label: "G. B. Belzoni, Narrative of the Operations and Recent Discoveries … in Egypt and Nubia (London, 1820)"
    used: The discovery in 1817 and the breach beyond the well. Not used for any dimension.
