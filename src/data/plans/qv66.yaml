title: Plan of QV66, the tomb of Nefertari
source: Simplified from published plans (Theban Mapping Project; Getty Conservation Institute). The arrangement of rooms is documented; dimensions and depths in this model are approximate.
note: The tomb is built on two levels, an upper suite reached from the entrance and a burial chamber reached by a descending stairway.
camera: { theta: 30, phi: 55 }
route: [qv66-1, qv66-2, qv66-5, qv66-6]
sources:
  - label: "J. K. McDonald, House of Eternity: The Tomb of Nefertari (Los Angeles: Getty, 1996)"
  - label: "M. A. Corzo and M. Afshar (eds), Art and Eternity: The Nefertari Wall Paintings Conservation Project 1986–1992 (Getty, 1993)"
  - label: Theban Mapping Project, QV 66 (plan)
    url: https://thebanmappingproject.com/
  - label: "E. Schiaparelli, Relazione sui lavori della Missione Archeologica Italiana in Egitto, vol. 1 (Turin, 1924)"
tour:
  - space: qv66-1
    text: The tomb is entered by a steep stairway cut into the hillside. Everything beyond it was painted on fine plaster over carved relief.
  - space: qv66-2
    scene: senet
    text: In the antechamber Nefertari plays senet, an image of her passage through the afterlife taken from Chapter 17 of the Book of the Dead.
  - space: qv66-2
    scene: thoth
    text: On another wall she stands before Thoth, god of writing, with a scribe's palette and water jar, the spell of Chapter 94.
  - space: qv66-4
    scene: offering
    text: Through the vestibule, the side chamber shows the queen offering to Osiris and to Atum.
  - space: qv66-4
    scene: cows
    text: The seven celestial cows and their bull promise her food for eternity (Chapter 148).
  - space: qv66-5
    scene: goddesses
    text: Descending the stairway, the queen offers to Hathor, Selkis and Maat.
  - space: qv66-5
    scene: maat
    text: At the foot of the stairs Maat, goddess of truth and order, spreads her wings over the doorway to the burial chamber.
  - space: qv66-6
    scene: pillars
    text: The burial chamber. Its pillars show Osiris as a djed pillar and priestly gods who served the dead queen.
  - space: qv66-6
    scene: gates
    text: The walls carry the gates of the underworld and their guardians, which the queen had to pass by knowing their names.
spaces:
  - id: qv66-1
    code: "1"
    name: Entrance stairway
    kind: stairs
    x: [-1.2, 1.2]
    y: [0, 6]
    floor: [0, -3]
    descends: y+
    height: 2.6
    status: approximate
    summary: Ernesto Schiaparelli's Italian mission opened the tomb in 1904. It had been robbed in antiquity.
  - id: qv66-2
    code: "2"
    name: Antechamber
    kind: chamber
    x: [-2.6, 2.6]
    y: [6, 11.2]
    floor: [-3, -3]
    height: 2.9
    decorated: [n, e, s, w]
    status: approximate
    summary: A room with a low rock-cut bench along its walls, painted with spells from the Book of the Dead.
    finds:
      - The tomb had been robbed in antiquity; Schiaparelli's team recovered fragments of the burial equipment, including shabti figures and a pair of sandals.
    scenes:
      - id: senet
        wall: w
        title: Nefertari playing senet
        text: Illustrating Chapter 17 of the Book of the Dead, the queen sits at a board game, which symbolised her passage through the afterlife. Her ba, a human-headed bird, perches nearby. The wall shown for this scene is simplified.
        status: approximate
      - id: thoth
        wall: n
        title: Nefertari before Thoth
        text: The queen stands before Thoth, god of writing, with a scribe's palette and water jar (Chapter 94 of the Book of the Dead). The wall shown is simplified.
        status: approximate
  - id: qv66-3
    code: "3"
    name: Vestibule
    kind: corridor
    x: [2.6, 4.2]
    y: [7.4, 9.8]
    floor: [-3, -3]
    height: 2.6
    decorated: [n, s]
    status: approximate
    summary: A short passage to the side chamber, where deities receive the queen.
  - id: qv66-4
    code: "4"
    name: Side chamber
    kind: annex
    x: [4.2, 9]
    y: [6.4, 10.8]
    floor: [-3, -3]
    height: 2.7
    decorated: [n, e, s]
    status: approximate
    summary: Nefertari makes offerings to Osiris and to Atum. One wall shows the seven celestial cows and their bull from Chapter 148 of the Book of the Dead.
    scenes:
      - id: offering
        wall: s
        title: Offerings to Osiris and Atum
        text: Nefertari presents offerings before Osiris, ruler of the dead, and Atum, the creator god. The wall shown is simplified.
        status: approximate
      - id: cows
        wall: e
        title: The seven cows and the bull
        text: Chapter 148 of the Book of the Dead, which promised the dead a supply of food for eternity. The wall shown for this scene is simplified.
        status: approximate
  - id: qv66-5
    code: "5"
    name: Descending stairway
    kind: stairs
    x: [-1.2, 1.2]
    y: [11.2, 20]
    floor: [-3, -8]
    descends: y+
    height: 2.8
    decorated: [e, w]
    status: approximate
    summary: The queen offers to Hathor, Selkis and Maat as she descends. Winged Maat guards the lower doorway.
    scenes:
      - id: goddesses
        wall: w
        title: Offerings to Hathor, Selkis and Maat
        text: Nefertari presents jars and offerings to the goddesses who will protect her.
        status: approximate
      - id: maat
        wall: e
        title: Winged Maat
        text: Maat, kneeling with outspread wings, guards the doorway at the foot of the stairs. Here the hotspot sits on the side wall near the lower end.
        status: approximate
  - id: qv66-6
    code: "6"
    name: Burial chamber
    kind: hall
    x: [-5.2, 5.2]
    y: [20, 30.4]
    floor: [-8, -8]
    height: 3.2
    pillars: [[-2.6, 22.8], [2.6, 22.8], [-2.6, 27.6], [2.6, 27.6]]
    decorated: [n, e, s, w]
    decoratedPillars: true
    status: approximate
    summary: A four-pillared hall with the Book of Gates on its walls. The pillars show Osiris as a djed pillar and priestly deities.
    sarcophagus:
      x: 0
      y: 25.2
      w: 1.3
      d: 2.8
      h: 1.2
      material: granite
      state: lost
      label: Granite sarcophagus, lost — only lid fragments survive (Turin)
    finds:
      - Fragments of the red granite sarcophagus lid (now in the Museo Egizio, Turin)
      - Fragments of a mummy, including a pair of knees, studied in 2016 and considered probably Nefertari's
    scenes:
      - id: pillars
        wall: s
        title: Djed pillars and priestly gods
        text: The faces of the pillars show Osiris in the form of a djed pillar, and gods such as Horus-Iunmutef who performed rituals for the dead.
      - id: gates
        wall: w
        title: The gates of the underworld
        text: Scenes from the Book of the Dead show the gates of the underworld and their guardians. The wall shown is simplified.
        status: approximate
  - id: qv66-7
    code: "7"
    name: Side chamber
    kind: annex
    x: [-9, -5.2]
    y: [22.5, 26.5]
    floor: [-8, -8]
    height: 2.4
    status: approximate
    summary: One of three small rooms opening off the burial chamber.
  - id: qv66-8
    code: "8"
    name: Side chamber
    kind: annex
    x: [5.2, 9]
    y: [22.5, 26.5]
    floor: [-8, -8]
    height: 2.4
    status: approximate
    summary: A second side room.
  - id: qv66-9
    code: "9"
    name: Rear chamber
    kind: annex
    x: [-2, 2]
    y: [30.4, 34.2]
    floor: [-8, -8]
    height: 2.4
    status: approximate
    summary: A small room behind the burial chamber.
