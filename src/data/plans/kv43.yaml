    height: 2.6
    measured: { length: 8.27, width: 2.24, area: 18.56, source: tmp, note: "Entryway A; orientation 196.92°; roughly cut and unfinished. No height published." }
    status: documented
    condition: unfinished
    conditionNote: The rock-cut stairway is roughly cut and unfinished.
    caveat: Length and width follow the survey; the height and drop are reconstructed.
    summary: Carter found the entrance in January 1903, working for the American patron Theodore Davis. There is no lintel or jambs between the stairway and corridor B.
