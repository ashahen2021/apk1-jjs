    height: 2.33
    decorated: [e, s, w]
    pit:
      x: [-1.5, 1.5]
      y: [35.6, 38.4]
      depth: 7
    measured: { length: 4.17, width: 4.16, height: 2.33, area: 17.24, source: tmp, note: Well chamber E; partly excavated. }
    status: documented
    caveat: The room follows the survey. The shaft is not measured on the survey page and has not been fully cleared; its size and 7 m depth are illustrative only.
    summary: A shaft cut through the floor crosses the route. Unusually for this tomb the walls are painted, apparently in haste, with the king before the gods. Both doorways had been sealed in antiquity.
    decoration: Six scenes of the king receiving life from Osiris (two forms), Anubis and Hathor (three forms) on the east wall; kheker frieze; stars on the ceiling. The scenes on the south wall continued onto the blocking of the next gate and were lost when robbers broke through it.
    scenes:
      - id: gods
        wall: e
        title: The king before the gods
        text: Thutmose IV receives life from two forms of Osiris, from Anubis and from three forms of Hathor.
