    measured: { length: 6.15, width: 10.26, height: 2.53, area: 63.11, source: tmp, note: Two pillars, average width 0.97 m. }
    status: documented
    caveat: The survey gives the room's size and two pillars; the pillar positions and the room's east–west position relative to the entrance axis are reconstructed.
    summary: An undecorated two-pillared chamber. Here the axis turns ninety degrees to the left (east). Red mason's lines on the ceiling mark the axes.
    finds:
      - Remains of the king's chariot body (the find spot within the tomb is not recorded here)
