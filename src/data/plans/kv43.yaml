    status: documented
    caveat: Its north–south position relative to the corridor is reconstructed.
    summary: The second decorated room, again painted in haste with the king before the gods. Two hieratic graffiti record an inspection of the burial in the reign of Horemheb. The axis turns left (north) a second time into the burial chamber.
    decoration: Osiris, Anubis and forms of Hathor presenting life to the king on the north and east walls, over a visible artists' grid; kheker frieze; stars on the ceiling.
    scenes:
      - id: gods
        wall: e
        title: The king before the gods
        text: Osiris, Anubis and three forms of Hathor present life to Thutmose IV. The artists' grid shows through the background paint.
      - id: graffito
        wall: s
        title: A restoration graffito
        text: Two hieratic texts on the south wall record that in year 8 of Horemheb the chief treasurer Maya, assisted by Djehutymes, steward of Thebes, restored the burial after robbers had broken in.
