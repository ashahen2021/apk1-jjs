title: Plan of KV43, the tomb of Thutmose IV
source: Simplified from Howard Carter's 1903 plan and the Theban Mapping Project. The sequence of spaces and the two turns in the axis are documented; dimensions and depths in this model are approximate.
note: Like other tombs of the mid 18th Dynasty, the axis turns twice at right angles before the burial chamber.
camera: { theta: 55, phi: 55 }
spaces:
  - id: kv43-1
    code: "1"
    name: Entrance stairway
    kind: stairs
    x: [-1.2, 1.2]
    y: [0, 8]
    floor: [0, -3]
    descends: y+
    height: 2.8
    status: approximate
    summary: Carter found the entrance in January 1903, working for the American patron Theodore Davis.
  - id: kv43-2
    code: "2"
    name: First corridor
    kind: corridor
    x: [-1.2, 1.2]
    y: [8, 19]
    floor: [-3, -6]
    descends: y+
    height: 2.6
    status: approximate
    summary: An undecorated sloping corridor.
  - id: kv43-3
    code: "3"
    name: Second stairway
    kind: stairs
    x: [-1.2, 1.2]
    y: [19, 27]
    floor: [-6, -10]
    descends: y+
    height: 2.6
    status: approximate
    summary: A second stairway takes the tomb deeper into the hillside.
  - id: kv43-4
    code: "4"
    name: Second corridor
    kind: corridor
    x: [-1.2, 1.2]
    y: [27, 36]
    floor: [-10, -12]
    descends: y+
    height: 2.6
    status: approximate
    summary: The corridor leads to the well chamber.
  - id: kv43-5
    code: "5"
    name: Well chamber
    kind: well
    x: [-2.1, 2.1]
    y: [36, 40.5]
    floor: [-12, -12]
    height: 3.2
    decorated: [n, e, s, w]
    pit:
      x: [-1.5, 1.5]
      y: [36.5, 40]
      depth: 7
    status: approximate
    caveat: The shaft depth is approximate.
    summary: A deep shaft across the route. Unusually, the walls of this chamber are painted, showing the king before the gods on a yellow ground.
    decoration: The king before Hathor, Anubis and Osiris, on a yellow ground.
  - id: kv43-6
    code: "6"
    name: Two-pillared hall
    kind: hall
    x: [-4.2, 4.2]
    y: [40.5, 48.5]
    floor: [-12, -12]
    height: 3
    pillars: [[-1.8, 44.5], [1.8, 44.5]]
    status: approximate
    summary: An undecorated pillared hall. Here the axis turns to the left for the first time.
  - id: kv43-7
    code: "7"
    name: Stairway
    kind: stairs
    x: [-14.2, -4.2]
    y: [45, 47.4]
    floor: [-12, -16]
    descends: x-
    height: 2.6
    status: approximate
    summary: A stairway descends from the pillared hall, running at right angles to the entrance corridors.
  - id: kv43-8
    code: "8"
    name: Corridor
    kind: corridor
    x: [-24, -14.2]
    y: [45, 47.4]
    floor: [-16, -18]
    descends: x-
    height: 2.6
    status: approximate
    summary: The last corridor before the antechamber.
  - id: kv43-9
    code: "9"
    name: Antechamber
    kind: chamber
    x: [-28.6, -24]
    y: [43.6, 48.8]
    floor: [-18, -18]
    height: 3
    decorated: [n, e, s, w]
    status: approximate
    summary: The second decorated room, again showing the king before the gods. The axis turns left a second time into the burial chamber.
    scenes:
      - id: graffito
        wall: n
        title: A restoration graffito
        text: A hieratic inscription records that in year 8 of Horemheb the official Maya restored the burial after robbers had broken in. Its exact position is simplified here.
        status: approximate
  - id: kv43-10
    code: "10"
    name: Burial chamber
    kind: hall
    x: [-33, -24.6]
    y: [48.8, 63]
    floor: [-18, -18]
    height: 3.2
    pillars: [[-30.6, 52], [-27, 52], [-30.6, 55.8], [-27, 55.8], [-30.6, 59.6], [-27, 59.6]]
    status: approximate
    summary: A six-pillared hall. Unlike the well chamber and antechamber, its walls were never decorated.
  - id: kv43-11
    code: "11"
    name: Crypt
    kind: crypt
    x: [-33, -24.6]
    y: [63, 69]
    floor: [-19.5, -19.5]
    height: 3.6
    status: approximate
    summary: A sunken area at the end of the hall, where the sarcophagus still stands.
    sarcophagus:
      x: -28.8
      y: 66
      w: 1.6
      d: 3
      h: 1.4
      material: quartzite
      state: in-situ
      label: Quartzite sarcophagus, still in place
  - id: kv43-12
    code: "12"
    name: Side chamber
    kind: annex
    x: [-38, -33]
    y: [50, 55]
    floor: [-18, -18]
    height: 2.4
    status: approximate
    caveat: The burial chamber has four side rooms; two are shown.
    summary: One of the storerooms opening off the burial chamber. Carter found the remains of the king's chariot body among the tomb's contents.
  - id: kv43-13
    code: "13"
    name: Side chamber
    kind: annex
    x: [-24.6, -20]
    y: [57, 62]
    floor: [-18, -18]
    height: 2.4
    status: approximate
    summary: A second storeroom off the burial chamber.
