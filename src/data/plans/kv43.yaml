title: Plan of KV43, the tomb of Thutmose IV
source: Every chamber, gate and side chamber is sized to the Theban Mapping Project survey of KV 43, using its letters (A–J, Ja–Jd). The sequence and the two left turns of the axis (east at the pillared chamber F, north at chamber I) follow the survey. The survey gives measurements, not coordinates, so the position of each doorway along its wall, the split between the two levels of the burial chamber and all floor depths are reconstructed.
note: North is at the top. The first corridors run south into the hillside; the axis turns left (east) at the pillared chamber and left again (north) into the burial chamber, which lies parallel to the entrance corridors.
levels: No depths are published on the Theban Mapping Project page. All floor levels, the depth of the well shaft and the drop to the lower level of the burial chamber are reconstructed.
camera: { theta: 150, phi: 55 }
route: [kv43-a, kv43-b, kv43-gc, kv43-c, kv43-gd, kv43-d, kv43-ge, kv43-e, kv43-gf, kv43-f, kv43-fd, kv43-gg, kv43-g, kv43-gh, kv43-h, kv43-gi, kv43-i, kv43-gj, kv43-j, kv43-j2]
sources:
  - id: tmp
    label: Theban Mapping Project, "KV 43 (Thutmes IV)", American Research Center in Egypt
    url: https://thebanmappingproject.com/tombs/kv-43-thutmes-iv
    used: Chamber sequence and axis turns; length, width, height, area and orientation of every chamber, gate and side chamber; pillar counts and widths; sarcophagus dimensions (3.0 × 1.69 × 1.99 m); decoration by wall; the Horemheb graffiti.
  - id: carter-newberry
    label: "H. Carter and P. E. Newberry, The Tomb of Thoutmôsis IV (Westminster, 1904)"
    used: Discovery history and finds. Not used for any dimension in this pass.
