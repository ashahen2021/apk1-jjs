    caveat: The overall size of the burial chamber follows the survey (14.42 × 8.36 m, up to 4.45 m high). How it divides between the upper pillared level and the sunken rear level, the pillar positions and the ceiling height of this level are reconstructed.
    summary: A six-pillared hall on an upper level. A stepped descent between the last pair of pillars leads down to the sarcophagus. Its walls were never decorated; red mason's lines and conical lumps of plaster survive on them.
