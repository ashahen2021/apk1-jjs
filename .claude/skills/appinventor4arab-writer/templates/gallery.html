<style>
#pgal{direction:rtl;margin:20px 0;font-family:inherit}
#pgal .sg-wrap{position:relative}
#pgal .sg-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none;border-radius:12px;border:1px solid #e5e5e5;align-items:flex-start}
#pgal .sg-track::-webkit-scrollbar{display:none}
#pgal .sg-slide{flex:0 0 100%;margin:0;scroll-snap-align:start}
#pgal .sg-frame{aspect-ratio:4/3;background:#f4f4f4;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pgal .sg-frame img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
#pgal figcaption{background:#fff;padding:10px 12px;text-align:right;font-size:16px;line-height:1.6;border-top:1px solid #e5e5e5}
#pgal .sg-credit{display:block;font-size:12px;color:#777}
#pgal .sg-credit a{color:#777}
#pgal .sg-nav{position:absolute;top:calc(37.5% - 22px);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:22px;line-height:44px;cursor:pointer;padding:0;direction:ltr}
#pgal .sg-nav:disabled{opacity:.25;cursor:default}
#pgal .sg-count{direction:ltr;unicode-bidi:isolate}
#pgal .sg-newer{right:10px}
#pgal .sg-older{left:10px}
#pgal .sg-bar{display:flex;justify-content:space-between;align-items:center;margin:8px 2px;font-size:14px;color:#555}
#pgal .sg-thumbs{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:thin}
#pgal .sg-thumb{flex:0 0 auto;width:72px;border:2px solid transparent;border-radius:8px;background:#f4f4f4;padding:2px;cursor:pointer;text-align:center}
#pgal .sg-thumb img{width:64px;height:64px;object-fit:cover;border-radius:6px;display:block}
#pgal .sg-thumb span{display:block;font-size:12px;color:#333}
#pgal .sg-thumb.on{border-color:#ea0303}
</style>

<script>
(function(){
var g=document.getElementById('pgal');if(!g){return;}
var track=g.querySelector('.sg-track'),slides=g.querySelectorAll('.sg-slide'),thumbs=g.querySelectorAll('.sg-thumb'),tb=g.querySelector('.sg-thumbs');
var newer=g.querySelector('.sg-newer'),older=g.querySelector('.sg-older'),count=g.querySelector('.sg-count'),cur=0;
function mark(i){cur=i;count.textContent=(i+1)+' / '+slides.length;newer.disabled=(i===0);older.disabled=(i===slides.length-1);
for(var k=0;k!==thumbs.length;k++){thumbs[k].className=(k===i)?'sg-thumb on':'sg-thumb';}
var t=thumbs[i];tb.scrollTo({left:t.offsetLeft-thumbs[0].offsetLeft+(tb.clientWidth-t.offsetWidth)/2,behavior:'smooth'});}
function go(i){i=Math.max(0,Math.min(slides.length-1,i));track.scrollTo({left:slides[i].offsetLeft-slides[0].offsetLeft,behavior:'smooth'});mark(i);}
newer.onclick=function(){go(cur-1);};older.onclick=function(){go(cur+1);};
for(var k=0;k!==thumbs.length;k++){thumbs[k].onclick=function(){go(parseInt(this.getAttribute('data-i'),10));};}
track.setAttribute('tabindex','0');
track.addEventListener('keydown',function(e){if(e.key==='ArrowRight'){go(cur-1);e.preventDefault();}if(e.key==='ArrowLeft'){go(cur+1);e.preventDefault();}});
if('IntersectionObserver' in window){var io=new IntersectionObserver(function(es){es.forEach(function(en){if(en.isIntersecting){var i=Array.prototype.indexOf.call(slides,en.target);if(i!==cur){mark(i);}}});},{root:track,threshold:0.6});slides.forEach(function(s){io.observe(s);});}
mark(0);
})();
</script>
