<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=block" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:800px;overflow:hidden;font-family:'Cairo',sans-serif;background:radial-gradient(circle at 20% 50%,#3a1a06 0%,#140707 45%,#0b0b0d 100%);color:#fff;position:relative}
.stripe{position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.025) 0 2px,transparent 2px 28px)}
.text{position:absolute;right:70px;top:110px;width:620px}
.tag{display:inline-block;background:#ea0303;color:#fff;font-weight:800;font-size:26px;padding:4px 22px;border-radius:30px;margin-bottom:22px}
h1{font-weight:900;font-size:92px;line-height:1.15;letter-spacing:0}
h1 span{color:#ff6900}
.sub{font-weight:600;font-size:34px;color:#e8e8e8;margin-top:14px}
.chips{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px}
.chip{border:2px solid #ff6900;color:#ff6900;font-weight:800;font-size:25px;padding:4px 18px;border-radius:12px}
.foot{position:absolute;right:70px;bottom:92px;font-size:24px;color:#bbbbbb;font-weight:600}
.photo{position:absolute;left:70px;top:95px;width:400px;height:610px;border-radius:28px;overflow:hidden;box-shadow:0 30px 60px rgba(0,0,0,.6),0 0 0 6px #ea0303;transform:rotate(-4deg)}
.photo img{width:100%;height:100%;object-fit:cover;object-position:58% 50%}
.badge{position:absolute;left:400px;top:70px;background:#ff6900;color:#fff;font-weight:900;font-size:40px;width:130px;height:130px;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);box-shadow:0 10px 25px rgba(0,0,0,.5)}
</style></head><body>
<div class="stripe"></div>
<div class="photo"><img src="PHONE-PHOTO.jpg"></div>
<div class="badge">2026</div>
<div class="text">
<div class="tag">دليل الشراء</div>
<h1>أفضل هواتف <span>ريدمي</span> 2026</h1>
<div class="sub">وجميع أنواع هواتف ريدمي بالترتيب</div>
<div class="chips"><div class="chip">نوت 15 برو بلس</div><div class="chip">نوت 15 برو</div><div class="chip">ريدمي 17</div></div>
</div>
<div class="foot">المواصفات · المميزات والعيوب · الأسعار</div>
</body></html>
